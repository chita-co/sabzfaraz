name: site-crons
on:
  schedule:
    - cron: "0 3 1 * *"
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 9 * * *"
    - cron: "0 3 * * *"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      path:
        description: "نام مسیر کرون برای اجرای دستی"
        required: false

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoints
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.path }}
        run: |
          case "$SCHEDULE" in
            "0 3 1 * *") LIST="cleanup-analytics" ;;
            "0 2 * * *") LIST="expire-loyalty-points" ;;
            "30 2 * * *") LIST="generate-blog-posts" ;;
            "0 9 * * *") LIST="loyalty-expiry-reminders" ;;
            "0 3 * * *") LIST="expire-bulk-orders" ;;
            "0 * * * *") LIST="run-auction-bots finalize-auctions expire-auction-winner-payments expire-reverse-auctions expire-abandoned-orders" ;;
            *) LIST="$MANUAL" ;;
          esac
          test -n "$LIST" || exit 1
          FAIL=0
          for P in $LIST; do
            curl --fail-with-body --silent --show-error --max-time 120 --retry 2 \
              -o /tmp/out.txt -w "$P %{http_code}\n" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/$P" || FAIL=1
            head -c 500 /tmp/out.txt 2>/dev/null; echo
          done
          exit $FAIL